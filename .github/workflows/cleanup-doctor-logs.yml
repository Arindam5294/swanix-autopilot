name: cleanup-old-doctor-logs
on: workflow_dispatch
permissions:
  actions: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.STUDIO_GH_TOKEN }}
          GT: ${{ github.token }}
        run: |
          for id in 40076578337 40077386299 40077840921 40080041149; do
            for t in "$GH_TOKEN" "$GT"; do
              c=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $t" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/actions/runs/$id)
              echo "$id $c"; [ "$c" = "204" ] && break
            done
          done
