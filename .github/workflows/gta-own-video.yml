name: GTA VI Clips - script MY OWN gameplay video
on:
  workflow_dispatch:
    inputs:
      topic: { description: "What the video is about", default: "the full GTA 6 map", required: true }
      format: { description: "guide, ranking or challenge", default: "guide", required: true }
permissions: { contents: write }
jobs:
  script:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: gtaclips } }
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python own_video.py "${{ github.event.inputs.topic }}" "${{ github.event.inputs.format }}"
      - run: |
          python ../common/gitsave.py "gtaclips: own video script" --mirror gtaclips/scripts
