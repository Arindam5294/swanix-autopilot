name: Studio (Telegram content studio)
on:
  schedule:
    - cron: "*/5 * * * *"    # GitHub may run this late (5-15 min) when busy
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: { group: studio, cancel-in-progress: false }
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
      ITERA_API_KEY: ${{ secrets.ITERA_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      INCEPTION_API_KEY: ${{ secrets.INCEPTION_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      STUDIO_BUDGET_MIN: "24"   # stop starting new work after ~24 min; long jobs continue next run
      PYTHONUNBUFFERED: "1"
      STUDIO_INBOX_URL: https://swanix-studio-bot.swanixjobs.workers.dev
      STUDIO_INBOX_KEY: ${{ secrets.STUDIO_INBOX_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Read Telegram and make what was asked
        run: python studio/run.py
      - name: Save progress (offset, outputs for edits, long-job state, Botbeat queue)
        if: always()
        run: python common/gitsave.py "studio state" --mirror studio/offset.txt studio/state --lines botbeat/queue.txt
      - name: Keep going while jobs are left (books, mocks, retries)
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          W=$(python3 -c "import json,glob,time;r=[json.load(open(f)).get('retry_after',0) for f in glob.glob('studio/state/jobs/*.json')];print(-1 if not r else max(0,min(int(min(r)-time.time()),960)))")
          if [ "$W" -ge 0 ]; then sleep "$W"; gh workflow run studio.yml --ref main; fi
