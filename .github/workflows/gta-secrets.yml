name: GTA VI Secrets Shorts - "GTA 6 SECRETS · PART N" (verified guide tip + matching streamer clip)
on:
  workflow_dispatch:
    inputs:
      preview:
        description: "Preview only: send the Short to Telegram, do NOT upload, Part N NOT advanced, topic NOT marked used"
        type: boolean
        default: true
      hand_upload:
        description: "Hand upload: skip the YouTube API (no quota used), Telegram gets the file + title + description to post yourself"
        type: boolean
        default: true
  # Turn on once a few previews look right (times UTC; 00:30 UTC = 6:00 AM IST). Scheduled runs act as preview=false.
  schedule:
    - cron: "47 0 * * *"   # 6:17 AM IST daily Secrets Short (uploads)
permissions:
  contents: write
concurrency: { group: gtaclips, cancel-in-progress: false }   # same group as the other GTA modes: no overlapping uploads/git pushes
jobs:
  secrets:
    runs-on: ${{ vars.BOTBEAT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    defaults: { run: { working-directory: gtaclips } }
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      YTDLP_HOME_PROXY: ${{ secrets.YTDLP_HOME_PROXY }}
      # scheduled runs (if the cron above is enabled) count as preview=false, hand_upload=false
      PREVIEW: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.preview || 'false' }}
      HAND: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.hand_upload || 'false' }}
    steps:
      - name: Require GEMINI_API_KEY
        working-directory: .
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is missing. Add it under Settings > Secrets and variables > Actions. Tips and footage can't be verified without it, so nothing is made."
            curl -s -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode text="GTA Secrets: GEMINI_API_KEY secret is missing, nothing made. Add it in the repo's Actions secrets." "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" > /dev/null || true
            exit 1
          fi
      - uses: actions/checkout@v5
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core && pip install -q -U --pre "yt-dlp[default]" edge-tts gtts pillow numpy "opencv-python-headless<5" faster-whisper
      - name: Make the Secrets Short (guide tip -> verbatim quote check -> matching clip -> vision + speech check -> render)
        id: make
        run: |
          set +e
          python -u gta_secrets.py 2>&1 | tee err.txt; RC=${PIPESTATUS[0]}
          set -e
          if [ $RC -eq 0 ]; then echo "made=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "made=false" >> "$GITHUB_OUTPUT"
          if [ $RC -eq 3 ] || [ $RC -eq 5 ]; then
            python -c "import sys,pathlib; sys.path.insert(0,'../common'); from notify import telegram; p=pathlib.Path('out/no_secret.txt'); telegram('GTA Secrets: no verified secret today, nothing posted. ' + (p.read_text()[:1200] if p.exists() else ''))" || true
            exit 0
          fi
          python -c "import sys; sys.path.insert(0,'../common'); from notify import telegram; telegram(sys.argv[1])" "GTA Secrets failed: $(tail -c 300 err.txt)" || true
          exit 1
      - name: Gauntlet - tip check + footage check + fresh AI reviewer must say YES
        id: gate
        if: steps.make.outputs.made == 'true'
        run: |
          set +e; python secrets_gate.py; RC=$?; set -e
          if [ $RC -eq 0 ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ok=false" >> "$GITHUB_OUTPUT"
          python -c "import sys,json; sys.path.insert(0,'../common'); from notify import telegram; g=json.load(open('out/gate.json')); telegram('GTA Secrets: the reviewer said NO, nothing posted. Faults: ' + '; '.join(g.get('faults',[])))" || true
      - name: Preview only - send to Telegram, no upload, Part N + topic NOT marked used
        if: steps.make.outputs.made == 'true' && env.PREVIEW == 'true'
        env: { BOTBEAT_PREVIEW: "1" }   # runs even if the gate said no, so you can see why
        run: |
          python send_short.py
          python gta_secrets.py --lock-footage || echo "couldn't mark preview footage used"
          python -c "import sys,json,os; sys.path.insert(0,'../common'); from notify import telegram; m=json.load(open('out/metadata.json')); g=json.load(open('out/gate.json')) if os.path.exists('out/gate.json') else {}; t=m['tip']; telegram('Secrets preview: PART ' + str(m['part']) + ' - ' + m['topic'] + '\nGate: ' + ('YES' if g.get('pass') else 'NO ' + '; '.join(g.get('faults',[]))) + '\n\nTITLE: ' + m['title'] + '\n\nTIP: ' + t['summary'] + '\nQUOTE (found verbatim): \"' + t['quote'] + '\"\nGUIDE: ' + m['guide_url'] + '\nCLIP: ' + m['source_url'] + '\nFootage: ' + m['visual_safety'] + ' / speech ' + str(m.get('speech_check')) + '\n\nDESCRIPTION:\n' + m['description'])" || true
          python -c "import sys,json; sys.path.insert(0,'../common'); from notify import telegram; telegram(json.load(open('out/metadata.json'))['ig_caption'])" || true
      - name: Lock Part N + topic as used before posting (no repeats from re-runs/overlaps)
        id: lock
        if: steps.gate.outputs.ok == 'true' && env.PREVIEW != 'true'
        run: |
          set +e; python gta_secrets.py --lock; RC=$?
          if [ $RC -eq 4 ]; then echo "ok=false" >> "$GITHUB_OUTPUT"; echo "part/topic already posted, skipped"; exit 0; fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Upload to YouTube (API routes)
        if: steps.lock.outputs.ok == 'true' && env.HAND != 'true'
        continue-on-error: true
        env:
          GTA_YT_CLIENT_ID: ${{ secrets.GTA_YT_CLIENT_ID }}
          GTA_YT_CLIENT_SECRET: ${{ secrets.GTA_YT_CLIENT_SECRET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          GTA_YT_REFRESH_TOKEN: ${{ secrets.GTA_YT_REFRESH_TOKEN }}
        run: python upload_youtube.py || echo "all upload routes failed, Telegram gets the file"
      - name: Send it to you (share kit, or hand-upload kit) + the series IG caption
        if: steps.lock.outputs.ok == 'true'
        env: { HAND_UPLOAD: "${{ env.HAND == 'true' && '1' || '' }}" }
        run: |
          python send_short.py
          python -c "import sys,json; sys.path.insert(0,'../common'); from notify import telegram; telegram('📸 Secrets IG caption (Part ' + str(json.load(open('out/metadata.json'))['part']) + '):\n\n' + json.load(open('out/metadata.json'))['ig_caption'])" || true
      - uses: actions/upload-artifact@v5
        if: steps.make.outputs.made == 'true'
        with: { name: gta-secrets, path: gtaclips/out/, retention-days: 7 }
      - name: Remember Part N, used topics + clips, gate verdicts
        if: always() && steps.lock.outputs.ok == 'true'
        run: python ../common/gitsave.py "gtaclips - secrets used" --union gtaclips/secrets_topics.json gtaclips/secrets_used.json --mirror gtaclips/secrets_series.json gtaclips/upload_state.json gtaclips/RULES.md
