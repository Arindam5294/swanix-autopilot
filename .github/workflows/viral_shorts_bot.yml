name: Viral Trend Auto-Poster
on:
  schedule:
    - cron: '0 14 * * *' # Every day at 14:00 UTC (19:30 IST)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  post_viral_short:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install feedparser
      - name: Catch trend and queue a clip
        run: python botbeat/catch_trends.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Save queue (Botbeat workflow makes and uploads it)
        run: |
          git config user.name "botbeat"
          git config user.email "botbeat@users.noreply.github.com"
          git add botbeat/queue.txt botbeat/trend_state.json 2>/dev/null || git add botbeat/queue.txt
          git diff --cached --quiet && { echo "Nothing new queued."; exit 0; }
          git commit -m "botbeat: queue trending clip"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i*5))
          done
          echo "Could not push queue after 5 tries"; exit 1
