name: Repo Doctor (checks all repos, fixes errors, reports on Telegram)
# Started daily at 6:00 AM IST by the swanix-studio-bot Cloudflare Worker (GitHub's own cron doesn't fire on this repo),
# by /doctor now in Telegram, or by hand here. Switch off: /doctor off, a file OFF in the private repo, or repo variable DOCTOR_OFF=true.
# Engine: public repo Arindam5294/repo-doctor (pinned below). Settings, reports and the full run log live in the PRIVATE
# repo Arindam5294/repo-doctor-private and are committed there only. This repo is public, so this log stays minimal on purpose.
on:
  workflow_dispatch:
    inputs:
      repos:
        description: "Only these repos (comma list). Blank = all"
        required: false
        default: ""
      dry_run:
        description: "true = diagnose and report only, change nothing"
        required: false
        default: "false"
permissions:
  contents: read
concurrency: { group: repo-doctor, cancel-in-progress: false }
jobs:
  doctor:
    if: ${{ vars.DOCTOR_OFF != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      DOCTOR_GH_TOKEN: ${{ secrets.STUDIO_GH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LLM_ROUTER_URL: https://swanix-brain.swanixjobs.workers.dev/llm
      LLM_ROUTER_KEY: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      LLM_ROUTER_MODELS: "auto|hard,cerebras|gpt-oss-120b,nvidia|z-ai/glm-5.3-flash,mistral|mistral-medium-latest"
      DOCTOR_CONFIG: .private/config.json
      DOCTOR_REPORTS_DIR: .private/reports
      DOCTOR_STATE_FILE: .private/last_run.json
      DOCTOR_OFF_FILE: .private/OFF
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Get private settings
        uses: actions/checkout@v4
        with:
          repository: Arindam5294/repo-doctor-private
          token: ${{ secrets.STUDIO_GH_TOKEN }}
          path: .private
      - name: Get the Repo Doctor engine (public repo, pinned)
        uses: actions/checkout@v4
        with:
          repository: Arindam5294/repo-doctor
          ref: 65e676f352d783c34ceaf033a8f78bd6f817dd3b
          path: .repo-doctor
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install -q -r .repo-doctor/requirements.txt > /dev/null 2>&1
      - name: Check, fix and report (full log saved to the private repo)
        run: |
          # Inputs are read from the event file so they are never echoed into this public log.
          export ONLY_REPOS="$(jq -r '.inputs.repos // ""' "$GITHUB_EVENT_PATH")"
          export DRY_RUN="$(jq -r '.inputs.dry_run // "false"' "$GITHUB_EVENT_PATH")"
          mkdir -p .private/logs
          set +e
          python .repo-doctor/repo_doctor.py > .private/logs/last_run.log 2>&1
          rc=$?
          echo "Repo Doctor finished (exit $rc). Report sent to Telegram; details are in the private repo."
          exit $rc
      - name: Save report in the private repo
        if: always()
        working-directory: .private
        run: |
          git config user.name "Repo Doctor"; git config user.email "doctor@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git add -A reports last_run.json logs > /dev/null 2>&1 || true
            git diff --cached --quiet && break
            git commit -qm "Repo Doctor report $(TZ=Asia/Kolkata date +%F)" > /dev/null 2>&1 || break
            git pull -q --rebase origin main > /dev/null 2>&1 && git push -q origin HEAD:main > /dev/null 2>&1 && { echo "saved"; break; }
            sleep 5
          done
