name: Keys check (temporary, proxy test)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          for m in "nvidia|z-ai/glm-5.3-flash" "inception|mercury-3" "mistral|mistral-small-latest" "nara|minimax-m3.1-flash:free" "itera|qwen/qwen3.8-27b"; do
            c=$(curl -s -o /dev/null -w '%{http_code}' -m 100 https://swanix-brain.swanixjobs.workers.dev/llm -H "Authorization: Bearer $TELEGRAM_BOT_TOKEN" -H 'Content-Type: application/json' -d "{\"model\":\"$m\",\"messages\":[{\"role\":\"user\",\"content\":\"Say OK\"}],\"max_tokens\":200}")
            echo "::notice::$m $c"
          done
