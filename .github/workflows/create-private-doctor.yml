name: One-time - create private repo-doctor-private
# One-shot helper. Creates the PRIVATE repo Arindam5294/repo-doctor-private and copies the Repo Doctor
# settings/reports into it. Never changes any existing repo. Deleted after it has run.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  create:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.STUDIO_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Create private repo and seed it
        run: |
          set -e
          H=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          R=Arindam5294/repo-doctor-private
          code=$(curl -s -o /dev/null -w '%{http_code}' "${H[@]}" https://api.github.com/repos/$R)
          if [ "$code" = "200" ]; then echo "already exists"; else
            curl -s -o out.json -w 'create %{http_code}\n' "${H[@]}" -X POST https://api.github.com/user/repos \
              -d '{"name":"repo-doctor-private","private":true,"has_wiki":false,"has_projects":false,"has_issues":false,"auto_init":false,"description":"Private settings and reports for Repo Doctor"}'
            python3 -c "import json;d=json.load(open('out.json'));print('private =',d.get('private'));assert d.get('private') is True"
          fi
          cnt=$(curl -s "${H[@]}" https://api.github.com/repos/$R/commits?per_page=1 | python3 -c "import json,sys;d=json.load(sys.stdin);print(len(d) if isinstance(d,list) else 0)")
          if [ "$cnt" != "0" ]; then echo "already seeded"; exit 0; fi
          mkdir /tmp/p && cd /tmp/p
          cp "$GITHUB_WORKSPACE/doctor/config.json" config.json
          echo "# Repo Doctor (private settings and reports)" > README.md
          mkdir reports logs && cp "$GITHUB_WORKSPACE"/doctor/reports/*.md reports/
          cp "$GITHUB_WORKSPACE/doctor/last_run.json" last_run.json
          touch logs/.keep
          git init -q -b main && git config user.name "Repo Doctor" && git config user.email "doctor@users.noreply.github.com"
          git add -A && git commit -qm "Repo Doctor private settings, reports and last run (moved from swanix-autopilot)"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/$R.git" main >/dev/null 2>&1 && echo "seeded"
