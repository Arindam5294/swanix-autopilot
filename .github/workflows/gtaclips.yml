name: GTA VI Clips Shorts (@GTAviclipxx) - finds GTA 6 clips, edits, uploads
on:
  schedule:
    # 5 a day = the most the free YouTube API quota allows (resets 13:30 IST). Times in UTC, IST in comments.
    # LAUNCH DAY (NZ unlocks 16:30 IST Nov 18, US unlocks 10:30 IST Nov 19)
    # Each slot is ~30 min after a big region unlocks at its midnight.
    - cron: "0 11 18 11 *"    # Nov 18  4:30 PM IST = New Zealand unlock (fires ~5 PM after setup)
    # SKIPPED (saving quota for USA launch): cron "30 13 18 11 *"   # Nov 18  7:00 PM IST = Australia unlocked 6:30 PM IST
    # SKIPPED (saving quota for USA launch): cron "30 15 18 11 *"   # Nov 18  9:00 PM IST = Japan/Korea unlocked 8:30 PM IST
    # SKIPPED (saving quota for USA launch): cron "0 19 18 11 *"    # Nov 19 12:30 AM IST = INDIA unlocked at midnight
    - cron: "0 5 19 11 *"     # Nov 19 10:30 AM IST = USA East unlocks (12 AM ET)
    - cron: "0 7 19 11 *"     # Nov 19 12:30 PM IST = USA slot 2 (2:30 AM ET, Speed/Kai/xQc deep in their launch streams). Last upload before the 13:30 IST quota reset.
    # AFTER LAUNCH: peak hours (India evening + US evening), from Nov 19 evening
    - cron: "45 12 19-30 11 *"   # 6:00 PM IST  India evening
    # 8:00 PM IST India prime time is now the daily HINDI run (cron "31 14 ..." below)
    - cron: "45 16 19-30 11 *"   # 10:00 PM IST India late night / Europe evening
    - cron: "45 1 20-30 11 *"    # 7:00 AM IST  US evening (8:30 PM ET)
    - cron: "45 12,16 * 1-10,12 *"   # same peak times, other months (English)
    - cron: "31 14 19-30 11 *"     # 8:01 PM IST daily from Nov 19 = HINDI edition (India prime time). Replaces the old 8 PM English slot.
    - cron: "31 14 * 1-10,12 *"    # same Hindi slot, other months
    - cron: "45 1 * 1-10,12 *"
  workflow_dispatch:
    inputs:
      url:
        description: "Optional: make a GTA Short from this exact link (YouTube)"
        required: false
      topic:
        description: "(unused for GTA, leave blank)"
        required: false
      lang:
        description: "Language: blank = English, hi = Hindi edition"
        required: false
      preview:
        description: "Preview only: send the Short to Telegram, do NOT upload to YouTube"
        type: boolean
        default: false
      hand_upload:
        description: "Hand upload: skip the YouTube API (no quota used), Telegram gets the file + title + description to post yourself"
        type: boolean
        default: false
      genre:
        description: "Genre: funny, rage, racing, police, chaos, fails, wtf, clutch, scary, emotional, or type your own words. Blank = most viral"
        required: false
      sfx:
        description: "Sound effects: blank = match the genre, funny, serious, soft, off"
        required: false
      logo_url:
        description: "Client logo for THIS video: imgbb link (ibb.co/...). Different client = different link. Blank = no logo"
        required: false
permissions:
  contents: write
concurrency: { group: gtaclips, cancel-in-progress: false }
jobs:
  short:
    if: ${{ github.event_name != 'schedule' || vars.GTA_CRON == 'true' }}
    # Set repo variable BOTBEAT_RUNNER=self-hosted once a runner on your home PC (Linux + Docker) is online:
    # home internet is not bot-blocked by YouTube, so real footage downloads every time.
    runs-on: ${{ vars.BOTBEAT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    services:
      pot:   # free YouTube "proof of origin" token helper for yt-dlp
        image: brainicism/bgutil-ytdlp-pot-provider
        ports: ["4416:4416"]
    defaults: { run: { working-directory: gtaclips } }
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}        # optional: Twitch top GTA VI clips
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}            # optional: Kick live GTA VI streams
      KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
      GTA_LANG: ${{ (startsWith(github.event.schedule, '31 14 ') && 'hi') || github.event.inputs.lang || '' }}   # hi = Hindi edition
      GTA_GENRE: ${{ github.event.inputs.genre || vars.GTA_GENRE || '' }}       # scheduled runs use repo variable GTA_GENRE
      GTA_SFX: ${{ github.event.inputs.sfx || vars.GTA_SFX || '' }}
      BRAND_LOGO_URL: ${{ github.event.inputs.logo_url || '' }}   # per run only, never a saved/default logo
      BRAND_LOGO: ${{ vars.BRAND_LOGO || '' }}   # set repo variable BRAND_LOGO=off to stop the watermark
      BOTBEAT_VOICE: edge   # GTA channel uses its own edge-tts voice, not the Botbeat narrator
      YTDLP_HOME_PROXY: ${{ secrets.YTDLP_HOME_PROXY }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ github.ref_name }}" }   # newest code + used.json, even when an old run is re-run
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-core && pip install -q -U --pre "yt-dlp[default]" bgutil-ytdlp-pot-provider edge-tts gtts pillow "opencv-python-headless<5" faster-whisper && (pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu && pip install -q --no-deps demucs==4.1.0 && pip install -q dora-search julius openunmix einops lameenc soundfile pyyaml tqdm || echo "demucs install failed, voice_forward will skip")
      - uses: actions/setup-node@v4
        continue-on-error: true
        with: { node-version: "20" }
      - name: Remotion animated overlay (optional - make_short.py falls back to the PIL overlay if this fails)
        if: hashFiles('botbeat/remotion/package.json') != ''
        continue-on-error: true
        working-directory: botbeat/remotion
        run: (if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi) && npx remotion browser ensure
      - name: Optional cookies (only if YouTube/X block downloads)
        env: { YT_COOKIES: "${{ secrets.YT_COOKIES }}" }
        run: python fix_cookies.py || true
      - name: Free Cloudflare WARP proxy (runs BEFORE picking so YouTube lookups can use it too)
        continue-on-error: true
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          sleep 3
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 8
          if curl -s --max-time 15 -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -q "warp=on"; then echo "YTDLP_PROXY=socks5://127.0.0.1:40000" >> "$GITHUB_ENV"; echo "WARP on"; fi
      - uses: denoland/setup-deno@v2
      - name: Check the client logo link first (a bad link stops here, in seconds)
        if: github.event.inputs.logo_url != ''
        run: python brand.py --check
      - name: Pick a viral clip
        id: pick
        env: { MANUAL_URL: "${{ github.event.inputs.url }}", TOPIC: "${{ github.event.inputs.topic }}", SKIP_YOUTUBE: "${{ github.event_name == 'schedule' && !startsWith(github.event.schedule, '31 14 ') && !endsWith(github.event.schedule, ' 19 11 *') && '1' || '' }}" }   # scheduled: Twitch/Kick only, saves API quota for uploads
        run: |
          if [ -n "$MANUAL_URL" ] && [ -n "$TOPIC" ]; then echo "$MANUAL_URL #trend #general topic=${TOPIC// /_}" >> queue.txt
          elif [ -n "$MANUAL_URL" ]; then echo "$MANUAL_URL" >> queue.txt; fi
          CLIP=$(python find_clip.py || true)
          echo "$CLIP"
          { echo "clip<<EOF"; echo "$CLIP"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - name: Tell you when no clip qualified (so it never fails silently)
        if: steps.pick.outputs.clip == ''
        run: |
          if [ -n "$GTA_GENRE" ]; then python genre_judge.py --tell-no-fit || true; else
          python -c "import sys; sys.path.insert(0,'../common'); from notify import telegram; telegram('GTA VI Clips: no new viral clip passed the filters this run. Send the bot a link to force one.')" || true; fi
      - name: Free disk + add 8 GB swap (stops GitHub killing the runner when RAM runs out, exit 143)
        if: steps.pick.outputs.clip != ''
        continue-on-error: true
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo fallocate -l 8G /botbeat.swap && sudo chmod 600 /botbeat.swap && sudo mkswap /botbeat.swap && sudo swapon /botbeat.swap
          free -h; df -h /
      - name: Make the Short
        id: make
        if: steps.pick.outputs.clip != ''
        env: { CLIP: "${{ steps.pick.outputs.clip }}" }
        run: |
          set +e
          # live log (tee) so a killed run still shows how far it got
          python -u make_short.py "$CLIP" 2>&1 | tee err.txt; RC=${PIPESTATUS[0]}
          set -e
          if [ $RC -eq 0 ]; then echo "made=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # YouTube blocked this runner: don't stop, try up to 2 Twitch/Kick clips instead (they download fine from GitHub).
          set +e
          TRIED=$(python -c "import json,sys; print(json.loads(sys.argv[1])['url'])" "$CLIP" 2>/dev/null || true)
          for TRY in 1 2; do
            [ $RC -eq 3 ] || break
            echo "YouTube bot wall -> trying a Twitch/Kick clip instead (attempt $TRY)"
            NEXT=$(SKIP_YOUTUBE=1 EXCLUDE_URLS="$TRIED" python find_clip.py || true)
            [ -n "$NEXT" ] || { echo "no Twitch/Kick clip available"; break; }
            echo "$NEXT"
            TRIED="$TRIED $(python -c "import json,sys; print(json.loads(sys.argv[1])['url'])" "$NEXT")"
            CLIP="$NEXT"
            python -u make_short.py "$CLIP" 2>&1 | tee err.txt; RC=${PIPESTATUS[0]}
            if [ $RC -eq 0 ]; then echo "made=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          set -e
          echo "made=false" >> "$GITHUB_OUTPUT"
          if [ $RC -eq 3 ]; then
            # YouTube bot wall: no low-quality substitute is made. The clip stays unused and is retried next run.
            python -c "import sys; sys.path.insert(0,'../common'); from notify import telegram; telegram(sys.argv[1])" "GTA VI Clips: YouTube blocked the download from GitHub's servers and no Twitch/Kick clip worked either, so no Short was made this run (clip kept for the next run). Permanent fix: YT_COOKIES, YTDLP_HOME_PROXY, or BOTBEAT_RUNNER=self-hosted." || true
            echo "YouTube bot wall: skipped this run, clip retried next run"
            exit 0
          fi
          if [ $RC -eq 5 ]; then
            # trend clip was a photo slideshow: never retry it, no Short this run
            python -c "import json,sys; f='used.json'; u=json.load(open(f)); u.append(json.loads(sys.argv[1])['url']); json.dump(u,open(f,'w'))" "$CLIP"
            python -c "import sys; sys.path.insert(0,'../common'); from notify import telegram; telegram('GTA VI Clips: the trend clip was a photo slideshow, so it was skipped (no fake-footage Short).')" || true
            exit 0
          fi
          if [ $RC -eq 6 ]; then
            # the AI wrote a refusal/junk instead of a script: drop this clip for good, never upload it
            python -c "import json,sys; f='used.json'; u=json.load(open(f)); u.append(json.loads(sys.argv[1])['url']); json.dump(u,open(f,'w'))" "$CLIP"
            python -c "import sys; sys.path.insert(0,'../common'); from notify import telegram; telegram(sys.argv[1])" "GTA VI Clips: the script came back as an AI refusal, so the clip was dropped and nothing was uploaded. $(tail -c 200 err.txt)" || true
            exit 0
          fi
          python -c "import sys; sys.path.insert(0,'../common'); from notify import telegram; telegram(sys.argv[1])" "GTA VI Clips failed: $(tail -c 300 err.txt)" || true
          exit 1
      - name: Client logo watermark + genre sound effects (a logo that fails STOPS the run; sound-effect errors keep the original)
        if: steps.make.outputs.made == 'true'
        continue-on-error: ${{ github.event.inputs.logo_url == '' }}
        run: python brand.py out/short.mp4 out/short_x.mp4
      - name: Gauntlet - a fresh AI reviewer must say YES before anything posts
        id: gate
        if: steps.make.outputs.made == 'true'
        run: |
          set +e; python gate.py; RC=$?; set -e
          if [ $RC -eq 0 ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ok=false" >> "$GITHUB_OUTPUT"
          python -c "import json,sys; f='used.json'; u=json.load(open(f)); u.append(json.load(open('out/metadata.json'))['source_url']); json.dump(u,open(f,'w'))"
          python -c "import sys,json; sys.path.insert(0,'../common'); from notify import telegram; g=json.load(open('out/gate.json')); telegram('GTA VI Clips: the reviewer said NO, nothing posted. Faults: ' + '; '.join(g.get('faults',[])))" || true
      - name: Preview only - send to Telegram, no upload
        if: steps.make.outputs.made == 'true' && github.event.inputs.preview == 'true'
        env: { BOTBEAT_PREVIEW: "1" }   # preview runs even if the gate said no, so you can see why
        run: python send_short.py
      - name: Lock clip as used before uploading (no duplicates from re-runs/cancels/overlaps)
        id: lock
        if: steps.gate.outputs.ok == 'true' && github.event.inputs.preview != 'true'
        run: |
          set +e; python mark_used.py; RC=$?
          if [ $RC -eq 4 ]; then echo "ok=false" >> "$GITHUB_OUTPUT"; echo "clip already posted, upload skipped"; exit 0; fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Upload to YouTube (API, then scheduled, then browser)
        if: steps.lock.outputs.ok == 'true' && github.event.inputs.hand_upload != 'true'
        continue-on-error: true
        env:
          GTA_YT_CLIENT_ID: ${{ secrets.GTA_YT_CLIENT_ID }}
          GTA_YT_CLIENT_SECRET: ${{ secrets.GTA_YT_CLIENT_SECRET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          GTA_YT_REFRESH_TOKEN: ${{ secrets.GTA_YT_REFRESH_TOKEN }}
        run: |
          if [ -f cookies.txt ]; then pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null 2>&1 || true; fi
          if python upload_youtube.py; then
            echo uploaded
          else
            echo "all routes failed - diagnosing"; python diagnose_youtube.py || true
            echo "all routes failed, Telegram gets the file"
          fi
      - uses: actions/upload-artifact@v5
        if: always() && hashFiles('gtaclips/out/upload_error.png') != ''
        with: { name: upload-error-screenshot, path: gtaclips/out/upload_error.png, retention-days: 7 }
      - name: Post natively to TikTok + Instagram Reels (upload-post.com)
        if: steps.lock.outputs.ok == 'true'
        continue-on-error: true
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
        run: python crosspost.py
      - name: Send it to you
        if: steps.lock.outputs.ok == 'true'
        env: { HAND_UPLOAD: "${{ github.event.inputs.hand_upload == 'true' && '1' || '' }}" }
        run: python send_short.py
      - name: Clipping campaign - "submit now" ping + STATUS.md
        if: steps.lock.outputs.ok == 'true'
        continue-on-error: true
        run: python campaign.py notify
      - uses: actions/upload-artifact@v5
        if: steps.make.outputs.made == 'true'
        with: { name: gta-short, path: gtaclips/out/, retention-days: 7 }
      - name: Remember used clips
        if: always() && github.event.inputs.preview != 'true'
        run: |
          rm -f cookies.txt
          # race-safe save: keeps links Studio queued while this ran (Studio is the only Telegram reader now)
          python ../common/gitsave.py "gtaclips: used clips" --union gtaclips/used.json --mirror gtaclips/upload_state.json --mirror gtaclips/RULES.md --mirror gtaclips/STATUS.md --lines gtaclips/queue.txt
