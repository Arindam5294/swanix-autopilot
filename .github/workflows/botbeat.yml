name: Botbeat Shorts (made for you, sent to Telegram)
on:
  schedule:
    - cron: "0 2,14 * * *"     # 7:30 AM and 7:30 PM IST
  workflow_dispatch:
    inputs:
      url:
        description: "Optional: make a Short from this exact link"
        required: false
permissions:
  contents: write
concurrency: { group: botbeat, cancel-in-progress: false }
jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: { run: { working-directory: botbeat } }
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core && pip install -q -U yt-dlp edge-tts pillow
      - name: Optional cookies (only if YouTube/X block downloads)
        env: { YT_COOKIES: "${{ secrets.YT_COOKIES }}" }
        run: '[ -n "$YT_COOKIES" ] && printf "%s" "$YT_COOKIES" > cookies.txt || true'
      - name: Pick a viral clip
        id: pick
        env: { MANUAL_URL: "${{ github.event.inputs.url }}" }
        run: |
          if [ -n "$MANUAL_URL" ]; then echo "$MANUAL_URL" >> queue.txt; fi
          CLIP=$(python find_clip.py || true)
          echo "$CLIP"
          { echo "clip<<EOF"; echo "$CLIP"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - uses: denoland/setup-deno@v2
      - name: Make the Short
        if: steps.pick.outputs.clip != ''
        env: { CLIP: "${{ steps.pick.outputs.clip }}" }
        run: |
          if ! python make_short.py "$CLIP" 2> err.txt; then
            cat err.txt
            if grep -q "not a bot" err.txt; then MSG="Botbeat: YouTube blocked the download. Add or refresh the YT_COOKIES secret, then Run workflow again."; else MSG="Botbeat failed: $(tail -c 300 err.txt)"; fi
            python -c "import sys; sys.path.insert(0,'../common'); from notify import telegram; telegram(sys.argv[1])" "$MSG" || true
            exit 1
          fi
      - name: Send it to you
        if: steps.pick.outputs.clip != ''
        run: python send_short.py
      - uses: actions/upload-artifact@v4
        if: steps.pick.outputs.clip != ''
        with: { name: botbeat-short, path: botbeat/out/, retention-days: 7 }
      - name: Remember used clips
        if: always()
        run: |
          rm -f cookies.txt
          git config user.name "swanix-bot"; git config user.email "bot@users.noreply.github.com"
          git add used.json queue.txt tg_offset.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "botbeat: used clips" && git pull --rebase -q && git push)
