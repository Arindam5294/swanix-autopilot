name: Botbeat Shorts (made and uploaded to YouTube)
on:
  schedule:
    - cron: "0 2,14 * * *"     # 7:30 AM and 7:30 PM IST
  workflow_dispatch:
    inputs:
      url:
        description: "Optional: make a Short from this exact link"
        required: false
permissions:
  contents: write
concurrency: { group: botbeat, cancel-in-progress: false }
jobs:
  short:
    if: ${{ github.event_name != 'schedule' || vars.BOTBEAT_GH_CRON == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      pot:   # free YouTube "proof of origin" token helper for yt-dlp
        image: brainicism/bgutil-ytdlp-pot-provider
        ports: ["4416:4416"]
    defaults: { run: { working-directory: botbeat } }
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core && pip install -q -U yt-dlp bgutil-ytdlp-pot-provider edge-tts gtts pillow
      - name: Optional cookies (only if YouTube/X block downloads)
        env: { YT_COOKIES: "${{ secrets.YT_COOKIES }}" }
        run: '[ -n "$YT_COOKIES" ] && printf "%s" "$YT_COOKIES" > cookies.txt || true'
      - name: Pick a viral clip
        id: pick
        env: { MANUAL_URL: "${{ github.event.inputs.url }}" }
        run: |
          if [ -n "$MANUAL_URL" ]; then echo "$MANUAL_URL" >> queue.txt; fi
          CLIP=$(python find_clip.py || true)
          echo "$CLIP"
          { echo "clip<<EOF"; echo "$CLIP"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - uses: denoland/setup-deno@v2
      - name: Free Cloudflare WARP proxy (backup route if YouTube blocks GitHub)
        if: steps.pick.outputs.clip != ''
        continue-on-error: true
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          sleep 3
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 8
          if curl -s --max-time 15 -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -q "warp=on"; then echo "YTDLP_PROXY=socks5://127.0.0.1:40000" >> "$GITHUB_ENV"; echo "WARP on"; fi
      - name: Make the Short
        if: steps.pick.outputs.clip != ''
        env: { CLIP: "${{ steps.pick.outputs.clip }}" }
        run: |
          if ! python make_short.py "$CLIP" 2> err.txt; then
            cat err.txt
            if grep -q "not a bot" err.txt; then MSG="Botbeat: YouTube blocked every download route today. It retries at the next run automatically."; else MSG="Botbeat failed: $(tail -c 300 err.txt)"; fi
            python -c "import sys; sys.path.insert(0,'../common'); from notify import telegram; telegram(sys.argv[1])" "$MSG" || true
            exit 1
          fi
      - name: Upload to YouTube (API, then scheduled, then browser)
        if: steps.pick.outputs.clip != ''
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ -f cookies.txt ]; then pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null 2>&1 || true; fi
          python upload_youtube.py && echo uploaded || echo "all routes failed, Telegram gets the file"
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('botbeat/out/upload_error.png') != ''
        with: { name: upload-error-screenshot, path: botbeat/out/upload_error.png, retention-days: 7 }
      - name: Send it to you
        if: steps.pick.outputs.clip != ''
        run: python send_short.py
      - uses: actions/upload-artifact@v4
        if: steps.pick.outputs.clip != ''
        with: { name: botbeat-short, path: botbeat/out/, retention-days: 7 }
      - name: Remember used clips
        if: always()
        run: |
          rm -f cookies.txt
          # race-safe save: keeps links Studio queued while this ran (Studio is the only Telegram reader now)
          python ../common/gitsave.py "botbeat: used clips" --mirror botbeat/used.json botbeat/upload_state.json --lines botbeat/queue.txt
