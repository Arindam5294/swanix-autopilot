name: Job alerts (no applying)
on:
  schedule:
    - cron: "30 3,12 * * *"    # 9:00 AM and 6:00 PM IST
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency: { group: jobs, cancel-in-progress: false }
jobs:
  run:
    if: ${{ github.event_name != 'schedule' || vars.JOBS_ON == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python jobs/job_alerts.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: No Telegram? Email the digest as a GitHub issue
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ -f jobs/digest.md ]; then gh issue create --title "Job matches $(date -u +%F)" --body-file jobs/digest.md; rm jobs/digest.md; fi
      - run: |
          git config user.name "swanix-bot"; git config user.email "bot@users.noreply.github.com"
          git add jobs/seen.json && (git diff --cached --quiet || (git commit -m "jobs: seen" && git pull --rebase -q && git push))
